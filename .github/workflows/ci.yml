name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Tests never need a model or the network: point every external endpoint at a closed port.
      OLLAMA_URL: http://127.0.0.1:9
      AURUM_LLM_PROVIDER: ollama
      AURUM_CLOUD_OPT_IN: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Tesseract (receipt OCR test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Lint
        run: uv run ruff check aurum tests scripts
      - name: Tests
        run: uv run pytest -q -o addopts="" -p no:cacheprovider

  web-ui:
    name: Web UI (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-ui
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (eslint + i18n, vocabulary and contrast checks)
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build (static export)
        run: npm run build
