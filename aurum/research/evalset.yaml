# Research quality eval set.
#
# Each question names the {law, article} the top citation SHOULD land on, once the sources
# below are ingested (see `tests/fixtures/law/*.txt`, `scripts/ingest_law.py --offline`).
# `docs/research-eval.md` records the last run's precision@1 / abstain counts.
#
# `article` comparison in aurum.research.eval is normalized (lowercase, punctuation
# stripped, substring match) so "Artículo 113-E." and "113-E" count as the same article.

- id: mx-resico-platforms-es
  lang: es
  jurisdiction: MX
  question: "¿Cómo calculan el ISR las personas físicas que venden por plataformas tecnológicas bajo RESICO?"
  expected: {law: LISR, article: "113-E"}

- id: mx-resico-platforms-en
  lang: en
  jurisdiction: MX
  question: "How do individuals selling through technology platforms calculate income tax under RESICO?"
  expected: {law: LISR, article: "113-E"}

