# Law/guidance sources the tracker watches.
#
# fetch_method is honest about what each source actually needs, since none of this
# ships a real scraper yet:
#   feed  — an RSS/Atom or JSON feed the source publishes officially
#   api   — a documented, stable API (Federal Register, eCFR)
#   bulk  — a bulk-download index page (DOF, SAT catálogos) — needs a real HTML scraper
#           to enumerate today's entries; HttpFetcher here just re-fetches one URL and
#           hashes it, which only detects "the page changed", not "which item changed"
#   scrape — no feed/API at all (state-level Periódico Oficial); same caveat as bulk,
#           worse: layout is fragile and specific to each state's site
#
# Every source lists a `trust_tier` for aurum.core.explain.Citation. `url` is the page
# tracker.run() fetches and hashes — for `bulk`/`scrape` sources this is deliberately the
# index/landing page, not a specific document, until a per-source scraper is written.

- id: dof-daily
  name: "Diario Oficial de la Federación — edición diaria"
  jurisdiction: MX
  doc_type: statute
  fetch_method: bulk
  cadence: daily
  trust_tier: primary
  url: https://www.dof.gob.mx/index_113.php

