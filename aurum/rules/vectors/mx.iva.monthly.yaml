rule: mx.iva.monthly
version: "2026.1"
source: "LIVA art. 5 credit requirements; IVA trasladado on a cash basis."
_docs: &docs
  - uuid: PUE-AUG
    tipo: I
    direction: emitido
    emisor_rfc: XAXX010101000
    metodo_pago: PUE
    fecha: "2026-08-05"
    subtotal: "20000.00"
    total: "23200.00"
  - uuid: PPD-JUL
    tipo: I
    direction: emitido
    emisor_rfc: XAXX010101000
    metodo_pago: PPD
    fecha: "2026-07-10"
    subtotal: "30000.00"
    total: "34800.00"
  - uuid: REP-AUG
    tipo: P
    direction: emitido
    emisor_rfc: XAXX010101000
    fecha: "2026-08-20"
    subtotal: "0"
    total: "0"
    pagos:
      - fecha_pago: "2026-08-20"
        monto: "34800.00"
        uuid_relacionado: PPD-JUL
  - uuid: REC-OK
    tipo: I
    direction: recibido
    receptor_rfc: XAXX010101000
    metodo_pago: PUE
    forma_pago: "03"
    uso_cfdi: G03
    fecha: "2026-08-07"
    subtotal: "5000.00"
    total: "5800.00"
    iva_trasladado: "800.00"
  - uuid: REC-CASH
    tipo: I
    direction: recibido
    receptor_rfc: XAXX010101000
    metodo_pago: PUE
    forma_pago: "01"
    uso_cfdi: G03
    fecha: "2026-08-09"
    subtotal: "1000.00"
    total: "1160.00"
    iva_trasladado: "160.00"
  - uuid: REC-FIXED
    tipo: I
    direction: recibido
    receptor_rfc: XAXX010101000
    metodo_pago: PUE
    forma_pago: "03"
    uso_cfdi: I04
    fecha: "2026-08-12"
    subtotal: "10000.00"
    total: "11600.00"
    iva_trasladado: "1600.00"
  - uuid: REC-UNPAID
    tipo: I
    direction: recibido
    receptor_rfc: XAXX010101000
    metodo_pago: PPD
    forma_pago: "99"
    uso_cfdi: G03
    fecha: "2026-08-15"
    subtotal: "2000.00"
    total: "2320.00"
    iva_trasladado: "320.00"
  - uuid: REC-OTHER-RFC
    tipo: I
    direction: recibido
    receptor_rfc: XEXX010101000
    metodo_pago: PUE
    forma_pago: "03"
    uso_cfdi: G03
    fecha: "2026-08-16"
    subtotal: "500.00"
    total: "580.00"
    iva_trasladado: "80.00"
cases:
  - name: trasladado on collected income minus the one creditable expense
    inputs:
      period: "2026-08"
      rfc: XAXX010101000
      documents: *docs
    expect: {amount: "7200.00", currency: "MXN"}
    steps_contain: "cash_paid_expense"
  - name: fixed-asset IVA is excluded the way the prefill excludes it
    inputs:
      period: "2026-08"
      rfc: XAXX010101000
      documents: *docs
    expect: {amount: "7200.00", currency: "MXN"}
    steps_contain: "fixed_asset_iva"
  - name: an unpaid PPD expense is not creditable yet
    inputs:
      period: "2026-08"
      rfc: XAXX010101000
      documents: *docs
    expect: {amount: "7200.00", currency: "MXN"}
    steps_contain: "not_paid"
  - name: a month with no activity nets to zero
    inputs:
      period: "2026-09"
      rfc: XAXX010101000
      documents: *docs
    expect: {amount: "0.00", currency: "MXN"}
  - name: credits exceeding trasladado give a saldo a favor
    inputs:
      period: "2026-08"
      rfc: XAXX010101000
      documents:
        - uuid: REC-BIG
          tipo: I
          direction: recibido
          receptor_rfc: XAXX010101000
          metodo_pago: PUE
          forma_pago: "03"
          uso_cfdi: G01
          fecha: "2026-08-07"
          subtotal: "5000.00"
          total: "5800.00"
          iva_trasladado: "800.00"
    expect: {amount: "-800.00", currency: "MXN"}
    explain_contains: "saldo a favor"
