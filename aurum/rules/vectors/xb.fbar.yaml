rule: xb.fbar
version: '2026.1'
source: 31 C.F.R. § 1010.350; irs.gov FBAR page (aggregate over USD 10,000 at any
  time)
cases:
- name: no foreign accounts
  inputs:
    foreign_accounts: []
    lang: en
  expect:
    amount: '0.00'
    currency: USD
  explain_contains: no FBAR appears to be required
- name: two accounts aggregate over the threshold
  inputs:
    foreign_accounts:
    - country: MX
      institution: Banco Demo
      max_balance_usd: '9000'
    - country: MX
      institution: Banco Dos
      max_balance_usd: '3000'
    lang: en
  expect:
    amount: '12000.00'
    currency: USD
  explain_contains: likely required
- name: exactly ten thousand does not exceed the threshold
  inputs:
    foreign_accounts:
    - country: MX
      max_balance_usd: '10000'
    lang: en
  expect:
    amount: '10000.00'
    currency: USD
  explain_contains: no FBAR appears to be required
- name: one cent over the threshold
  inputs:
    foreign_accounts:
    - country: MX
      max_balance_usd: '10000.01'
    lang: en
  expect:
    amount: '10000.01'
    currency: USD
  explain_contains: likely required
- name: a non-US person has no FBAR duty
  inputs:
    us_person: false
    foreign_accounts:
    - country: MX
      max_balance_usd: '500000'
    lang: en
  expect:
    amount: '500000.00'
    currency: USD
  explain_contains: no FBAR appears to be required
- name: FATCA is a separate form
  inputs:
    foreign_accounts:
    - country: MX
      max_balance_usd: '50000'
    lang: en
  expect:
    amount: '50000.00'
    currency: USD
  steps_contain: '8938'
