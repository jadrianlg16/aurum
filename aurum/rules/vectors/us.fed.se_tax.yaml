rule: us.fed.se_tax
version: '2026.1'
source: IRC §§ 1401/1402; 2026 SS wage base 184,500 (irs.gov/taxtopics/tc751)
cases:
- name: zero profit
  inputs:
    net_profit: '0'
    lang: en
  expect:
    amount: '0.00'
    currency: USD
- name: a loss produces no SE tax
  inputs:
    net_profit: '-5000'
    lang: en
  expect:
    amount: '0.00'
    currency: USD
- name: below the wage base and below every additional-Medicare threshold
  inputs:
    net_profit: '100000'
    lang: en
  expect:
    amount: '14129.55'
    currency: USD
  steps_contain: '0.9235'
- name: single, above the wage base and above the 200k additional-Medicare threshold
  inputs:
    net_profit: '250000'
    filing_status: single
    lang: en
  expect:
    amount: '29851.26'
    currency: USD
  steps_contain: '184500'
- name: same profit filing jointly stays under the 250k threshold
  inputs:
    net_profit: '250000'
    filing_status: mfj
    lang: en
  expect:
    amount: '29573.38'
    currency: USD
- name: married filing separately crosses the 125k threshold early
  inputs:
    net_profit: '150000'
    filing_status: mfs
    lang: en
  expect:
    amount: '21316.06'
    currency: USD
- name: W-2 wages consume most of the OASDI wage base
  inputs:
    net_profit: '60000'
    wages: '180000'
    lang: en
  expect:
    amount: '2483.58'
    currency: USD
  steps_contain: min(net earnings, base
- name: aliases for the filing status are accepted
  inputs:
    net_profit: '100000'
    filing_status: married_filing_jointly
    lang: en
  expect:
    amount: '14129.55'
    currency: USD
- name: not advice
  inputs:
    net_profit: '1000'
    lang: en
  expect:
    amount: '141.29'
    currency: USD
  explain_contains: not tax advice
